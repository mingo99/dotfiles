#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
	# Plugins
	{ on = "z", run = "plugin zoxide", desc = "Jump to a directory via zoxide" },
	{ on = "Z", run = "plugin fzf", desc = "Jump to a file/directory via fzf" },
	{ on = [ "c", "m" ], run = "plugin chmod", desc = "Chmod on selected files" },
	{ on = "<Enter>", run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },
	{ on = "<A-p>", run = "plugin toggle-pane min-preview", desc = "Hide or show preview pane" },
	{ on = "M", run = "plugin toggle-pane max-preview", desc = "Maximize or restore preview pane" },
	{ on = "f", run = "plugin jump-to-char", desc = "Jump to char" },
	{ on = [ "g", "s" ], run = "plugin vcs-files", desc = "Show git file changes" },
	{ on = "H", run = "plugin duckdb -1", desc = "Scroll one column to the left" },
	{ on = "L", run = "plugin duckdb +1", desc = "Scroll one column to the right" },
	{ on = [ "g", "o" ], run = "plugin duckdb -open", desc = "Open with duckdb" },
	{ on = [ "g", "u" ], run = "plugin duckdb -ui", desc = "Open with duckdb ui" },
]
