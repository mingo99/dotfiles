#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 2, 5]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]

[preview]
tab_size = 2
max_width = 1080
max_height = 1920
cache_dir = ""
image_delay = 30
image_filter = "triangle"
image_quality = 90
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
	{ run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" },
	{ run = 'code %*', orphan = true, desc = "code", for = "windows" },
	{ run = 'code -w %*', block = true, desc = "code (block)", for = "windows" },
]

[plugin]
prepend_previewers = [
	{ url = "*.csv", run = "duckdb" },
	{ url = "*.tsv", run = "duckdb" },
	{ url = "*.parquet", run = "duckdb" },
	{ url = "*.xlsx", run = "duckdb" },
	{ url = "*.db", run = "duckdb" },
	{ url = "*.duckdb", run = "duckdb" },
]

[input]
cursor_blink = false
